name: tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'ops_test' || ':memory:' }}
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, intl, dom, fileinfo, zip, pdo_sqlite, pdo_pgsql, sockets
          coverage: none

      - name: Create the environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Node packages
        run: npm ci

      - name: Install the browser for the accessibility check
        run: npx playwright install --with-deps chromium

      - name: Generate the application key
        run: php artisan key:generate

      - name: Show which database the tests will use
        run: php artisan tinker --execute 'echo DB::connection()->getDriverName();'

      - name: Run the tests
        run: php artisan test
